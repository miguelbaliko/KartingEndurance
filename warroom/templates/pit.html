<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<title>Pit Lane — War Room</title>
<style>
/* Phone in one hand, kart in the other: big targets, no scrolling to act. */
:root{
  --bg:#0a0d12; --bg2:#111721; --bg3:#18202c; --line:#232c3a;
  --tx:#e8eef7; --tx2:#94a3b8; --tx3:#5a6678;
  --red:#ef4444; --grn:#22c55e; --lime:#84cc16; --ylw:#eab308;
  --blue:#3b82f6; --purple:#a855f7;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);
     font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
     padding:0 12px calc(28px + env(safe-area-inset-bottom));
     -webkit-font-smoothing:antialiased}

header{position:sticky;top:0;z-index:5;background:var(--bg);
       padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.hd-row{display:flex;align-items:baseline;gap:8px}
.hd-title{font-size:17px;font-weight:700;letter-spacing:-.01em}
.hd-tag{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.14em;
        color:var(--tx3)}
.hd-sub{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--tx2);
        margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.dot.ok{background:var(--grn)}
.clock{font-variant-numeric:tabular-nums;color:var(--tx)}

/* Our own stop. The pit clock is the one thing read at arm's length. */
.mine{background:linear-gradient(180deg,#0d2233,#0a1622);border:1px solid #1d4a6b;
      border-radius:var(--r);padding:14px;margin-bottom:12px}
.mine.box{background:linear-gradient(180deg,#2a0f0f,#1a0a0a);border-color:#7c2020}
.mine-hd{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--blue);
         margin-bottom:8px}
.mine.box .mine-hd{color:var(--red)}
.mine-clock{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;
            line-height:1;letter-spacing:-.02em}
.mine-clock.ok{color:var(--grn)}
.mine-row{display:flex;align-items:flex-end;gap:12px}
.mine-meta{font-size:12px;color:var(--tx2);padding-bottom:4px}
.mine-tag{font-size:11px;font-weight:700;color:var(--grn);margin-top:6px}

.ask{background:linear-gradient(180deg,#2a1f0a,#1a1508);
     border:1px solid #7c5e12;border-radius:var(--r);padding:13px;margin-bottom:12px}
.ask-hd{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--ylw);
        margin-bottom:9px}
.ask-team{font-size:16px;font-weight:700;margin-bottom:2px}
.ask-meta{font-size:11px;color:var(--tx2);margin-bottom:11px}
.ask-btns{display:flex;gap:8px;flex-wrap:wrap}
.lane-btn{flex:1 1 96px;padding:14px 10px;border:none;border-radius:10px;
          background:var(--bg3);color:var(--tx);font-size:14px;font-weight:700;
          cursor:pointer;border-left:4px solid var(--line)}
.lane-btn:active{background:#243044}
.ask-alt{flex:1 1 0;padding:10px 6px;background:transparent;border:1px solid var(--line);
         border-radius:10px;color:var(--tx3);font-size:11px;cursor:pointer;line-height:1.3}
.ask-alt:active{color:var(--tx)}

.lane{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);
      margin-bottom:14px;overflow:hidden}
.lane-top{height:4px}
.lane-hd{display:flex;align-items:center;gap:8px;padding:12px 13px 9px}
.lane-name{font-size:15px;font-weight:700}
.lane-color{font-size:11px;color:var(--tx2)}
.lane-count{margin-left:auto;font-size:11px;color:var(--tx2)}
.karts{padding:0 13px 13px;display:flex;flex-direction:column;gap:8px}

.kart{display:flex;align-items:center;gap:10px;padding:12px;
      background:var(--bg3);border:1px solid var(--line);border-radius:10px}
.kart.next{border-color:var(--blue);background:#16233a}
.kart-num{font-size:22px;font-weight:800;min-width:42px;font-variant-numeric:tabular-nums}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
      border:1px solid;white-space:nowrap}
.chip.godlike{color:var(--purple);border-color:#4c2a6b;background:#1d1129}
.chip.verygood{color:var(--grn);border-color:#1d5134;background:#0d2318}
.chip.good{color:var(--lime);border-color:#3f5518;background:#16200a}
.chip.ok{color:var(--tx2);border-color:var(--line);background:var(--bg)}
.chip.bad{color:var(--red);border-color:#5e2222;background:#210f0f}
.chip.unknown{color:var(--tx3);border-color:var(--line);background:transparent}
.kart-lap{margin-left:auto;font-size:13px;color:var(--tx2);
          font-variant-numeric:tabular-nums}
.kart-next{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--blue)}
.kart-x{background:none;border:none;color:var(--tx3);font-size:17px;padding:0 2px;
        cursor:pointer}
.add{width:100%;padding:13px;background:transparent;border:1px dashed var(--line);
     border-radius:10px;color:var(--tx2);font-size:13px;cursor:pointer}
.empty{color:var(--tx3);font-size:12px;padding:2px 0 8px}

.foot{display:flex;gap:8px;margin-top:16px}
.foot button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--line);
             background:var(--bg2);color:var(--tx2);font-size:12px;font-weight:600;
             cursor:pointer}
.foot button.warn{color:var(--ylw)}
.log{margin-top:16px;font-size:11px;color:var(--tx3);line-height:1.7}
.log b{color:var(--tx2);font-weight:600}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pick button{padding:9px 11px;background:var(--bg3);border:1px solid var(--line);
             border-radius:8px;color:var(--tx);font-size:12px;cursor:pointer}
dialog{border:none;border-radius:var(--r);background:var(--bg2);color:var(--tx);
       padding:16px;width:min(320px,88vw)}
dialog::backdrop{background:#000a}
dialog input{width:100%;padding:12px;font-size:18px;background:var(--bg);
             border:1px solid var(--line);border-radius:8px;color:var(--tx);
             margin:10px 0;font-variant-numeric:tabular-nums}
dialog .row{display:flex;gap:8px}
dialog button{flex:1;padding:11px;border-radius:8px;border:none;font-size:13px;
              font-weight:600;cursor:pointer}
.b-go{background:var(--blue);color:#fff}
.b-no{background:var(--bg3);color:var(--tx2)}
</style>
</head>
<body>

<header>
  <div class="hd-row">
    <span class="hd-title" id="race">War Room</span>
    <span class="hd-tag">PIT LANE</span>
  </div>
  <div class="hd-sub">
    <span class="dot" id="dot"></span>
    <span id="conn">connecting…</span>
    <span class="clock" id="clock"></span>
  </div>
</header>

<div id="mine"></div>
<div id="asks"></div>
<div id="lanes"></div>

<div class="foot">
  <button onclick="missedStop()">A stop the feed missed</button>
  <button class="warn" onclick="undo()">↶ Undo</button>
</div>

<div id="pickwrap"></div>
<div class="log" id="log"></div>

<dialog id="kartdlg">
  <div style="font-size:13px;color:var(--tx2)" id="dlg-title">Kart number</div>
  <input id="dlg-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
  <div class="row">
    <button class="b-no" onclick="document.getElementById('kartdlg').close()">Cancel</button>
    <button class="b-go" onclick="dlgOk()">OK</button>
  </div>
</dialog>

<script>
let POOL = null, STATE = null, _dlgDone = null, _picking = false;

const CHIP = {
  'Godlike':'godlike', 'Very Good':'verygood', 'Good':'good',
  'OK':'ok', 'Bad':'bad', 'Unknown':'unknown'
};

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function lap(sec){
  if (!sec) return '';
  const m = Math.floor(sec/60), s = (sec%60);
  return m ? `${m}:${s.toFixed(3).padStart(6,'0')}` : s.toFixed(3);
}

async function post(path, body){
  await fetch('/api/'+path, {method:'POST', headers:{'Content-Type':'application/json'},
                             body: JSON.stringify(body||{})});
  await refresh();
}

async function refresh(){
  try {
    const [p, s] = await Promise.all([
      fetch('/api/karts').then(r=>r.json()),
      fetch('/api/state').then(r=>r.json())
    ]);
    POOL = p; STATE = s;
    render();
  } catch (e) {
    document.getElementById('conn').textContent = 'offline';
    document.getElementById('dot').classList.remove('ok');
  }
}

function render(){
  const sess = (STATE.apex_session||{}).name || STATE.team_name || 'War Room';
  document.getElementById('race').textContent = sess;
  document.getElementById('dot').className = 'dot' + (STATE.apex_ok ? ' ok' : '');
  document.getElementById('conn').textContent =
    (STATE.apex_ok ? 'Connected' : 'No signal') +
    ' · ' + (STATE.clock_source === 'apex' ? 'race clock from Apex' : 'local clock');
  document.getElementById('clock').textContent = '· ' + STATE.race_remaining_fmt + ' left';

  renderMine();
  renderAsks();
  renderLanes();
  buzzOnNewQuestion();
  document.getElementById('log').innerHTML = (POOL.log||[]).slice(0,8)
    .map(l => `<div><b>${esc(l.ts)}</b> ${esc(l.team ? l.team+' — ' : '')}${esc(l.text)}</div>`)
    .join('');
}

/** "in the lane with #4, #9 and 3 more" — never the whole field. */
function withThem(p) {
  const them = p.with_them || [];
  if (!them.length) return '';
  const shown = them.slice(0, 3).map(n => '#' + esc(n)).join(', ');
  return ` · in the lane with ${shown}` +
         (them.length > 3 ? ` and ${them.length - 3} more` : '');
}

/** Our own pit stop: the feed starts and ends it, this just shows the clock. */
function renderMine(){
  const el = document.getElementById('mine');
  const pitting = STATE.status === 'pitting';
  const my = STATE.my_team;
  if (!pitting && !my){ el.innerHTML = ''; return; }
  if (!pitting){
    el.innerHTML = `<div class="mine">
      <div class="mine-hd">OUR KART</div>
      <div class="mine-row">
        <span class="mine-clock" style="font-size:30px">${esc(my.phys_kart||'—')}</span>
        <span class="mine-meta">P${esc(my.pos)} · stint ${esc(STATE.stint_fmt)}</span>
      </div></div>`;
    return;
  }
  const met = STATE.pit_min_met;
  el.innerHTML = `<div class="mine box">
    <div class="mine-hd">IN THE BOX${STATE.auto_pit ? ' · STARTED BY THE FEED' : ''}</div>
    <div class="mine-row">
      <span class="mine-clock ${met?'ok':''}">${esc(STATE.pit_remaining_fmt)}</span>
      <span class="mine-meta">minimum pit time</span>
    </div>
    ${met ? '<div class="mine-tag">✓ MINIMUM MET — GO WHEN READY</div>' : ''}
  </div>`;
}

/** A new question is easy to miss on a phone in a pit lane. */
let _lastAsk = 0;
function buzzOnNewQuestion(){
  const ids = (POOL.pending||[]).map(p => p.id);
  const newest = ids.length ? Math.max(...ids) : 0;
  if (newest > _lastAsk && _lastAsk !== 0 && navigator.vibrate) {
    navigator.vibrate([90, 60, 90]);
  }
  _lastAsk = Math.max(_lastAsk, newest);
}

/** Phones sleep. A pit lane phone must not. */
async function keepAwake(){
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); }
  catch (e) { /* denied or unsupported — the page still works */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { keepAwake(); refresh(); }
});

function renderAsks(){
  const el = document.getElementById('asks');
  const pending = POOL.pending || [];
  if (!pending.length){ el.innerHTML = ''; return; }

  el.innerHTML = pending.map((p, i) => {
    const waiting = p.in_box_s != null
      ? `in the box for ${Math.floor(p.in_box_s/60)}:${String(p.in_box_s%60).padStart(2,'0')}`
      : `stopped at ${esc(p.at)}`;
    if (p.state === 'await_kart'){
      return `<div class="ask">
        <div class="ask-hd">WHICH KART DID THEY GET?</div>
        <div class="ask-team">${esc(p.team || ('#'+p.team_no))}</div>
        <div class="ask-meta">the lane was empty — read the number off the kart</div>
        <div class="ask-btns">
          <button class="lane-btn" onclick="askKart(${p.id})">Enter kart number</button>
        </div></div>`;
    }
    const order = p.asks === 'order';
    const lanes = (POOL.lanes||[]).map(l => {
      const front = l.karts.length ? esc(l.karts[0].num) : '?';
      const label = order ? `Took kart ${front}` : esc(l.name);
      const sub = order ? 'they were first out'
                        : (l.karts.length ? `kart ${front} next` : 'empty');
      return `<button class="lane-btn" style="border-left-color:${esc(l.color)}"
        onclick="post('kart/lane',{stop_id:${p.id},lane:${l.lane}})">
        ${label}<div style="font-size:10px;font-weight:400;color:var(--tx2);
        margin-top:3px">${sub}</div></button>`;
    }).join('');
    const also = withThem(p);
    return `<div class="ask">
      ${i === 0 ? `<div class="ask-hd">${order ? 'WHO WENT OUT FIRST?' : 'WHICH LANE?'}</div>` : ''}
      <div class="ask-team">${esc(p.team || ('#'+p.team_no))}${
        p.kart_in ? ` · kart ${esc(p.kart_in)}` : ''}${
        p.category ? ` <span style="font-size:11px;color:var(--tx3)">${esc(p.category)}</span>` : ''}</div>
      <div class="ask-meta">${waiting}${also}</div>
      <div class="ask-btns">${lanes}
        <button class="ask-alt" onclick="askKart(${p.id})">Type the kart<br>number</button>
        ${POOL.swap_every_stop === false ? `
        <button class="ask-alt" onclick="post('kart/lane',{stop_id:${p.id},no_change:true})">
          No kart change<br>driver only</button>` : ''}
      </div></div>`;
  }).join('');
}

function renderLanes(){
  document.getElementById('lanes').innerHTML = (POOL.lanes||[]).map(l => `
    <div class="lane">
      <div class="lane-top" style="background:${esc(l.color)}"></div>
      <div class="lane-hd">
        <span class="lane-name">${esc(l.name)}</span>
        <span class="lane-count">${l.karts.length} kart${l.karts.length===1?'':'s'}</span>
      </div>
      <div class="karts">
        ${l.karts.length ? l.karts.map((k,i) => kartRow(k,i===0,l.lane)).join('')
                         : '<div class="empty">Empty — add the karts waiting here, in the order they will be handed out.</div>'}
        <button class="add" onclick="addKart(${l.lane})">+ kart</button>
      </div>
    </div>`).join('');
}

function kartRow(k, isNext, lane){
  const cls = CHIP[k.label] || 'unknown';
  const delta = k.delta == null ? '' : (k.delta > 0 ? '+' : '') + k.delta.toFixed(2);
  return `<div class="kart ${isNext?'next':''}">
    <span class="kart-num">${esc(k.num)}</span>
    <span class="chip ${cls}">${esc(k.label)}${delta ? ' '+delta : ''}</span>
    <span class="kart-lap">${lap(k.best_s)}</span>
    ${isNext ? '<span class="kart-next">NEXT</span>' : ''}
    <button class="kart-x" title="Remove"
            onclick="post('kart/remove',{lane:${lane},kart:'${esc(k.num)}'})">✕</button>
  </div>`;
}

/* ── input ───────────────────────────────────────────────────────────── */
function dialog(title, done){
  _dlgDone = done;
  document.getElementById('dlg-title').textContent = title;
  const inp = document.getElementById('dlg-input');
  inp.value = '';
  document.getElementById('kartdlg').showModal();
  setTimeout(()=>inp.focus(), 50);
}
function dlgOk(){
  const v = document.getElementById('dlg-input').value.trim();
  document.getElementById('kartdlg').close();
  if (v && _dlgDone) _dlgDone(v);
}
document.getElementById('dlg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') dlgOk();
});

function addKart(lane){
  dialog('Kart number joining ' + (POOL.lanes.find(l=>l.lane===lane)||{}).name,
         v => post('kart/add', {lane, kart:v}));
}
function askKart(stopId){
  dialog('Kart number they were given', v => post('kart/lane', {stop_id:stopId, kart:v}));
}
function undo(){ post('kart/undo'); }

function missedStop(){
  const wrap = document.getElementById('pickwrap');
  _picking = !_picking;
  if (!_picking){ wrap.innerHTML = ''; return; }
  const teams = (STATE.teams||[]);
  wrap.innerHTML = `<div class="pick">${teams.map(t => `
    <button onclick="pickTeam('${esc(t.kart)}')">#${esc(t.kart)} ${esc(t.team)}</button>`
  ).join('')}</div>`;
}
function pickTeam(teamNo){
  _picking = false;
  document.getElementById('pickwrap').innerHTML = '';
  post('kart/stop', {team_no: teamNo});
}

refresh();
keepAwake();
setInterval(refresh, 2000);
</script>
</body>
</html>
