services:
  - type: web
    name: alcanede-apex-recorder
    runtime: python
    plan: free
    region: frankfurt
    rootDir: apex-recorder
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APEX_EVENT
        value: kartalcanede
      - key: DATABASE_URL
        fromDatabase:
          name: alcanede-apex
          property: connectionString
databases:
  - name: alcanede-apex
    plan: free
    region: frankfurt
    databaseName: alcanede_apex
    user: alcanede_apex_user
    postgresMajorVersion: "16"
